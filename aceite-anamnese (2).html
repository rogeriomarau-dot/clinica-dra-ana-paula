<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aceite de Anamnese — Clínica Dra. Ana Paula Müller Araujo</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --azul:#2f6690; --azul-escuro:#1a3d5c; --fundo:#f4f7fa; --texto:#222; --borda:#dbe3ea;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--fundo); color:var(--texto); padding:16px; }
  .wrap{ max-width:640px; margin:0 auto; }
  .header{ text-align:center; padding:18px 10px; }
  .header h1{ font-size:19px; color:var(--azul-escuro); margin:0 0 4px; }
  .header p{ margin:0; color:#666; font-size:13px; }
  .card{ background:#fff; border:1px solid var(--borda); border-radius:10px; padding:18px; margin-bottom:14px; }
  .card h3{ font-size:14px; color:var(--azul-escuro); border-bottom:1px solid var(--borda); padding-bottom:6px; margin:0 0 10px; }
  .pergunta{ margin-bottom:12px; }
  .pergunta label{ display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .pergunta .resp{ background:var(--fundo); border-radius:6px; padding:8px 10px; font-size:14px; min-height:18px; }
  .resp.vazio{ color:#999; font-style:italic; }
  .aceite-box{ border:2px solid var(--azul); }
  .aceite-box label.chk{ display:flex; align-items:flex-start; gap:10px; font-size:14px; font-weight:600; margin-bottom:14px; cursor:pointer; }
  .aceite-box input[type=checkbox]{ width:18px; height:18px; margin-top:2px; flex-shrink:0; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .field input[type=text]{ width:100%; padding:10px; border:1px solid var(--borda); border-radius:6px; font-size:15px; }
  .aviso{ font-size:12.5px; color:#666; margin-top:10px; line-height:1.5; }
  .btn{ width:100%; padding:14px; border:none; border-radius:8px; background:var(--azul); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:disabled{ background:#aab8c2; cursor:not-allowed; }
  .estado{ text-align:center; padding:40px 20px; color:#555; }
  .ok-box{ background:#e8f7ee; border:1px solid #8fd3a8; color:#1c6b3c; border-radius:10px; padding:18px; text-align:center; font-size:15px; }
  .erro-box{ background:#fdeaea; border:1px solid #e0a3a3; color:#a12f2f; border-radius:10px; padding:18px; text-align:center; font-size:15px; }
  #app{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🦷 Clínica Dra. Ana Paula Müller Araujo</h1>
    <p>Leitura e aceite da anamnese</p>
  </div>
  <div id="carregando" class="estado">Carregando anamnese...</div>
  <div id="app"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCKZY9rkLSt6kCoWTawA09D_GThERxu4dM",
  authDomain: "clinica-dra-ana-paula.firebaseapp.com",
  projectId: "clinica-dra-ana-paula",
  storageBucket: "clinica-dra-ana-paula.firebasestorage.app",
  messagingSenderId: "1005436531013",
  appId: "1:1005436531013:web:a05db02918204255e1ce2c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CLINICA_WHATSAPP_NUMERO = '51991109595';

// Modelo de perguntas PADRÃO — usado apenas como fallback para anamneses
// antigas que ainda não guardam seu próprio "retrato" de perguntas
// (templateSnapshot). Anamneses criadas após a atualização do sistema
// principal trazem suas próprias perguntas salvas dentro do documento,
// então esta página sempre exibe exatamente as perguntas que o paciente
// respondeu, mesmo que a Dra. altere o modelo depois no sistema.
const ANAMNESE_TEMPLATE = [
  { secao: 'Histórico geral', perguntas: [
    { id:'trat_medico', texto:'Está em tratamento médico atualmente? Qual?' },
    { id:'cirurgia_previa', texto:'Já foi submetido a alguma cirurgia? Qual e quando?' },
    { id:'hemorragia', texto:'Tem histórico de hemorragia ou dificuldade de cicatrização?' },
    { id:'alergia_anestesia', texto:'Já teve reação alérgica a anestesia odontológica?' },
  ]},
  { secao: 'Alergias', perguntas: [
    { id:'alergia_medicamento', texto:'É alérgico a algum medicamento? Qual?' },
    { id:'alergia_outros', texto:'É alérgico a látex, iodo ou outras substâncias?' },
  ]},
  { secao: 'Condições de saúde', perguntas: [
    { id:'cardiaco', texto:'Problemas cardíacos' },
    { id:'hipertensao', texto:'Hipertensão (pressão alta)' },
    { id:'diabetes', texto:'Diabetes' },
    { id:'renal', texto:'Problemas renais' },
    { id:'hepatico', texto:'Problemas hepáticos' },
    { id:'respiratorio', texto:'Doenças respiratórias (asma, bronquite)' },
    { id:'epilepsia', texto:'Epilepsia ou convulsões' },
    { id:'coagulacao', texto:'Distúrbios de coagulação sanguínea' },
    { id:'hiv_hepatite', texto:'HIV/Hepatite' },
    { id:'osteoporose', texto:'Osteoporose (uso de bisfosfonatos)' },
  ]},
  { secao: 'Medicação e hábitos', perguntas: [
    { id:'medicacao_continua', texto:'Uso contínuo de medicamentos (quais)' },
    { id:'anticoagulante', texto:'Uso de anticoagulante (ex: AAS, Marevan, Xarelto)' },
    { id:'fumante', texto:'Fumante? Quantidade/frequência' },
    { id:'alcool', texto:'Consome bebida alcoólica?' },
  ]},
  { secao: 'Mulheres', perguntas: [
    { id:'gravidez', texto:'Está grávida ou suspeita de gravidez?' },
    { id:'amamentando', texto:'Está amamentando?' },
  ]},
  { secao: 'Observações', perguntas: [
    { id:'observacoes', texto:'Observações adicionais relevantes' },
  ]},
];

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n){ return n.toString().padStart(2,'0'); }
function formatDateBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return pad2(d)+'/'+pad2(m)+'/'+y;
}
function telParaWhatsapp(tel){
  if(!tel) return null;
  let digitos = String(tel).replace(/\D/g,'');
  if(!digitos) return null;
  if(digitos.length >= 12 && digitos.startsWith('55')) return digitos;
  if(digitos.length === 10 || digitos.length === 11) return '55'+digitos;
  return digitos;
}

const params = new URLSearchParams(window.location.search);
const anamneseId = params.get('id');
const app = document.getElementById('app');
const carregando = document.getElementById('carregando');

if(!anamneseId){
  carregando.innerHTML = '<div class="erro-box">Link inválido. Peça um novo link para a clínica.</div>';
} else {
  db.collection('anamneses').doc(anamneseId).get().then(doc=>{
    if(!doc.exists){
      carregando.style.display='none';
      app.style.display='block';
      app.innerHTML = '<div class="erro-box">Não encontramos essa anamnese. Peça um novo link para a clínica.</div>';
      return;
    }
    const a = { id: doc.id, ...doc.data() };
    renderApp(a);
  }).catch(err=>{
    carregando.style.display='none';
    app.style.display='block';
    app.innerHTML = '<div class="erro-box">Não foi possível carregar a anamnese agora. Tente novamente em instantes.</div>';
    console.error(err);
  });
}

function renderApp(a){
  carregando.style.display='none';
  app.style.display='block';

  const template = (a.templateSnapshot && a.templateSnapshot.length) ? a.templateSnapshot : ANAMNESE_TEMPLATE;
  const perguntasHtml = template.map(sec => `
    <div class="card">
      <h3>${escapeHtml(sec.secao)}</h3>
      ${sec.perguntas.map(p=>{
        const r = (a.respostas && a.respostas[p.id]) || {resposta:'',obs:''};
        const texto = r.resposta ? escapeHtml(r.resposta) + (r.obs ? ' — '+escapeHtml(r.obs) : '') : '';
        return `<div class="pergunta">
          <label>${escapeHtml(p.texto)}</label>
          <div class="resp${texto?'':' vazio'}">${texto || '— não respondido —'}</div>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  if(a.ciente){
    app.innerHTML = `
      <div class="card"><b>Paciente:</b> ${escapeHtml(a.clienteNome)}<br><b>Data da anamnese:</b> ${formatDateBR(a.data)}</div>
      ${perguntasHtml}
      <div class="ok-box">✅ Esta anamnese já foi lida e aceita por <b>${escapeHtml(a.assinaturaNome)}</b>. Não é possível dar o aceite novamente.</div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="card"><b>Paciente:</b> ${escapeHtml(a.clienteNome)}<br><b>Data da anamnese:</b> ${formatDateBR(a.data)}</div>
    ${perguntasHtml}
    <div class="card aceite-box">
      <h3>Confirmação de leitura e aceite</h3>
      <label class="chk">
        <input type="checkbox" id="chkCiente">
        <span>Li e estou ciente da anamnese</span>
      </label>
      <div class="field">
        <label>Nome completo (paciente ou responsável legal)</label>
        <input type="text" id="nomeAceite" value="${escapeHtml(a.clienteNome)}">
      </div>
      <button class="btn" id="btnConfirmar" onclick="confirmarAceite('${a.id}')">Confirmar aceite</button>
      <div class="aviso">Ao confirmar, este documento não poderá mais ser editado ou alterado por ninguém, nem pela clínica. Em seguida, o WhatsApp será aberto automaticamente com uma mensagem de confirmação pronta para você enviar à Dra. Ana Paula.</div>
    </div>
  `;
}

function confirmarAceite(anamneseId){
  const ciente = document.getElementById('chkCiente').checked;
  const nome = document.getElementById('nomeAceite').value.trim();
  if(!ciente){ alert('Marque a caixa "Li e estou ciente da anamnese" para confirmar.'); return; }
  if(!nome){ alert('Informe o nome completo.'); return; }
  const btn = document.getElementById('btnConfirmar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  db.collection('anamneses').doc(anamneseId).update({
    ciente: true,
    assinaturaNome: nome,
    aceiteDataHora: firebase.firestore.FieldValue.serverTimestamp(),
  }).then(()=>{
    return db.collection('anamneses').doc(anamneseId).get();
  }).then(doc=>{
    const a = doc.data();
    const dataFmt = formatDateBR(a.data);
    const msg = `Eu, ${nome}, declaro que li e estou ciente da anamnese preenchida em ${dataFmt} na Clínica Dra. Ana Paula Müller Araujo.`;
    const numero = telParaWhatsapp(CLINICA_WHATSAPP_NUMERO);
    window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(msg), '_blank');
    app.innerHTML = `<div class="ok-box">✅ Aceite confirmado com sucesso, obrigado! Se o WhatsApp não abriu automaticamente, <a href="https://wa.me/${numero}?text=${encodeURIComponent(msg)}" target="_blank">clique aqui</a> para enviar a confirmação para a clínica.</div>`;
  }).catch(err=>{
    alert('Não foi possível confirmar o aceite. Tente novamente. ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Confirmar aceite';
  });
}
</script>
</body>
</html>
